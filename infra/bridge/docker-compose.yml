# ═══════════════════════════════════════════════════════════════════════════════
# CodeCapsule — Azure VM Docker Compose
#
# Runs the complete backend stack on a single Azure VMSS instance:
#   1. Piston  (code execution engine) — private Docker network only
#   2. Bridge API (Express server) — /internal/* + /api/v2/* proxy
#
# cloudflared (host systemd service) sends ALL tunnel traffic to bridge:3000.
# Piston is NEVER exposed to the host — only bridge-api can reach it via
# Docker internal DNS at http://piston:2000.
#
# Usage:
#   docker compose up -d          # start stack
#   docker compose logs -f        # tail logs
#   docker compose down           # stop
# ═══════════════════════════════════════════════════════════════════════════════

services:
  # ── 1. Piston — Code Execution Engine (Custom Image with Datasets) ─────────
  piston:
    build:
      context: .
      dockerfile: Dockerfile.piston
    image: devcapsules-piston:latest
    container_name: devcapsules_piston
    restart: always
    # NOT exposed to host — only bridge-api reaches it on the Docker network
    expose:
      - "2000"
    privileged: true
    environment:
      # Raise Piston server-side limits to prevent signal 6 (SIGABRT) for
      # pandas/numpy workloads that need more than the 256MB default.
      - PISTON_RUN_MEMORY_LIMIT=-1
      - PISTON_COMPILE_MEMORY_LIMIT=-1
      - PISTON_OUTPUT_MAX_SIZE=1048576
      - PISTON_MAX_PROCESS_COUNT=128
    tmpfs:
      - /piston/jobs:exec,size=256M    # Ephemeral execution scratch
    volumes:
      - piston-packages:/piston/packages    # Persist installed runtimes
      - /tmp/piston-isolate:/piston/isolate # Writable isolate directory
    networks:
      - devcapsules_net
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:2000/api/v2/runtimes',r=>{process.exit(r.statusCode===200?0:1)}).on('error',()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ── 2. Bridge API — Internal Route Handler + Piston Proxy ──────────────────
  bridge-api:
    build:
      context: /opt/devcapsules-repo       # Monorepo root (cloned by cloud-init)
      dockerfile: apps/bridge-api/Dockerfile
    container_name: devcapsules_bridge
    restart: always
    ports:
      # Exposed to host so cloudflared → localhost:3000
      - "3000:3000"
    depends_on:
      piston:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=3000
      - PISTON_URL=http://piston:2000      # Docker internal DNS
    networks:
      - devcapsules_net
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  piston-packages:
    driver: local

networks:
  devcapsules_net:
    driver: bridge
